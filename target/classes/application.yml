spring:
  application:
    name: maahish-api
  profiles:
    active: local
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB

server:
  port: 8080
  servlet:
    context-path: /api

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

maahish:
  jwt:
    secret: ${JWT_SECRET:maahish-dev-secret-change-in-production-min-256-bits-long-key-here}
    access-token-expiration-ms: 3600000
    refresh-token-expiration-ms: 604800000
  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000,http://localhost:5176
  otp:
    expiration-minutes: 10
    length: 6
  razorpay:
    key-id: ${RAZORPAY_KEY_ID}
    key-secret: ${RAZORPAY_KEY_SECRET}
    currency: INR
  pagination:
    default-size: 20
    max-size: 100
  sms:
    enabled: ${SMS_ENABLED:true}
    provider: ${SMS_PROVIDER:console}
    api-key: ${SMS_API_KEY:}
    sender-id: ${SMS_SENDER_ID:MAAHSH}
    country-code: ${SMS_COUNTRY_CODE:91}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}
  folder: maahish/products

logging:
  level:
    com.maahish: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: OFF
    org.hibernate.orm.jdbc.bind: OFF
    org.hibernate.type.descriptor.sql: OFF