spring:
  profiles:
    active: local
  application:
    name: maahish-api
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB

server:
  port: 8080
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    db:
      enabled: true
    mail:
      enabled: true
    redis:
      enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

maahish:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration-ms: 3600000
    refresh-token-expiration-ms: 604800000
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  otp:
    expiration-minutes: 10
    length: 6
    max-verify-attempts: 5
    resend-cooldown-seconds: 60
    max-sends-per-hour: 5
  order-tracking:
    max-attempts-per-hour: 30
    max-attempts-per-ip-per-hour: 20
  payment:
    max-initiate-attempts-per-hour: 10
    max-verify-attempts-per-hour: 20
  auth:
    max-login-attempts-per-hour: 10
    max-forgot-password-attempts-per-hour: 5
    max-register-attempts-per-hour: 5
    max-seller-register-attempts-per-hour: 3
    max-verify-otp-attempts-per-hour: 10
    cookie:
      secure: ${AUTH_COOKIE_SECURE:false}
      same-site: ${AUTH_COOKIE_SAME_SITE:Lax}
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
    require-webhook-secret: ${RAZORPAY_REQUIRE_WEBHOOK_SECRET:false}
    currency: INR
  pagination:
    default-size: 20
    max-size: 100
  rate-limit:
    backend: memory

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}
  folder: maahish/products

logging:
  level:
    com.maahish: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: OFF
    org.hibernate.orm.jdbc.bind: OFF
    org.hibernate.type.descriptor.sql: OFF