# Copy to application-local.yml for local development (gitignored).
# Run locally with: SPRING_PROFILES_ACTIVE=local (or -Dspring.profiles.active=local)
# For production, set SPRING_PROFILES_ACTIVE=prod and use environment variables below.

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/maahish_db
    username: YOUR_DB_USER
    password: YOUR_DB_PASSWORD
  jpa:
    hibernate:
      ddl-auto: update
  flyway:
    enabled: false
  mail:
    host: smtp.example.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}

maahish:
  jwt:
    secret: YOUR_256_BIT_RANDOM_SECRET
  cors:
    allowed-origins: http://localhost:5173
  razorpay:
    key-id: rzp_test_XXXX
    key-secret: YOUR_TEST_SECRET
    require-webhook-secret: false

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

# --- Production environment variables (SPRING_PROFILES_ACTIVE=prod) ---
# DATABASE_URL=jdbc:mysql://host:3306/maahish_db?useSSL=true
# DATABASE_USERNAME=
# DATABASE_PASSWORD=
# JWT_SECRET=
# CORS_ALLOWED_ORIGINS=https://www.themaahish.com,https://themaahish.com
# AUTH_COOKIE_SECURE=true
# AUTH_COOKIE_SAME_SITE=None
# RAZORPAY_KEY_ID=rzp_live_XXXX
# RAZORPAY_KEY_SECRET=
# RAZORPAY_WEBHOOK_SECRET=
# MAIL_HOST= MAIL_USERNAME= MAIL_PASSWORD=
# CLOUDINARY_CLOUD_NAME= CLOUDINARY_API_KEY= CLOUDINARY_API_SECRET=
# REDIS_HOST= REDIS_PORT=6379 REDIS_PASSWORD= REDIS_SSL=false
